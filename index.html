<!doctype html>
<!-- English, matching the app's own fallback language: `detectLanguage()`
     returns 'en' for anything it does not recognise and
     `DEFAULT_SETTINGS.language` is 'en' (core/settings.ts). Game.tsx
     rewrites this attribute to the player's detected language on mount, so
     this value is what a crawler reads and what an unrecognised locale
     gets — exactly the two cases the i18n fallback already covers. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/zahlenkoenig/crown.svg" />
    <link rel="icon" href="/zahlenkoenig/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/zahlenkoenig/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- --zk-accent (tokens.css, hue 214) as fixed hex — see vite.config.ts's
         own note on why this can't just read the CSS custom property, and
         why this and the manifest's theme_color have to stay in sync by hand. -->
    <meta name="theme-color" content="#2962ae" />

    <title>Zahlenkönig</title>
    <meta
      name="description"
      content="Reach the target using every number exactly once. Plus, minus, times, divide and brackets you place yourself. Free, no sign-up, plays offline."
    />
    <meta name="author" content="funnygerman" />
    <!-- No `canonical` and no `robots`: this is a single page with no
         query strings, no duplicate URLs and nothing to disambiguate, and
         the default crawl behaviour is already index+follow. Both were
         here and both were doing nothing. There are no hreflang tags for
         a related reason — the app runs in three languages off this one
         URL, and hreflang needs a second URL to point at. -->

    <!-- Sharing previews (Open Graph / Twitter). A scraper fetches this URL
         from its own server, once, with no idea who will see the result, so
         a card is fixed per URL and cannot follow a reader's language the
         way the app itself does — which is the same reason this page is in
         the fallback language rather than in any particular player's. The
         game's own name stays German because it is a name.
         The absolute URLs are required by both specs — a relative og:image
         is ignored by most scrapers — so they repeat the deployed base from
         vite.config.ts's `base`. src/seo.test.ts pins the two to each
         other, and pins the Twitter card to the Open Graph one so the two
         can't drift apart. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zahlenkönig" />
    <meta property="og:title" content="Zahlenkönig – a free number puzzle game" />
    <meta
      property="og:description"
      content="Reach the target using every number exactly once. Plus, minus, times, divide — and brackets you place yourself. No sign-up, plays offline."
    />
    <meta property="og:url" content="https://funnygerman.github.io/zahlenkoenig/" />
    <meta property="og:image" content="https://funnygerman.github.io/zahlenkoenig/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Zahlenkönig: the puzzle (6 + 2) × (9 − 3) with the target 48" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zahlenkönig – a free number puzzle game" />
    <meta
      name="twitter:description"
      content="Reach the target using every number exactly once. Plus, minus, times, divide — and brackets you place yourself. No sign-up, plays offline."
    />
    <meta name="twitter:image" content="https://funnygerman.github.io/zahlenkoenig/og-image.png" />

    <!-- Structured data (schema.org). This is the one part of the page a
         search engine and an LLM-based crawler can read *as data* rather
         than as prose, so it carries the facts that matter: what the thing
         is, that it costs nothing, who it is for, and what it can do. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://funnygerman.github.io/zahlenkoenig/#website",
            "url": "https://funnygerman.github.io/zahlenkoenig/",
            "name": "Zahlenkönig",
            "inLanguage": ["en", "de", "ru"]
          },
          {
            "@type": ["SoftwareApplication", "Game"],
            "@id": "https://funnygerman.github.io/zahlenkoenig/#app",
            "name": "Zahlenkönig",
            "url": "https://funnygerman.github.io/zahlenkoenig/",
            "description": "Zahlenkönig is a number puzzle for the browser. You are given two to four numbers and a target, and you have to reach the target using every number exactly once. Plus, minus, times and divide are allowed, as are brackets you place yourself; how many numbers, which operators and how big the target should be are all chosen before you start. Every puzzle is generated on the device and is guaranteed to be solvable.",
            "applicationCategory": ["GameApplication", "EducationalApplication"],
            "applicationSubCategory": "Puzzle",
            "operatingSystem": "Web browser (Android, iOS, Windows, macOS, Linux)",
            "browserRequirements": "Requires JavaScript",
            "inLanguage": ["en", "de", "ru"],
            "isAccessibleForFree": true,
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "EUR"
            },
            "audience": {
              "@type": "EducationalAudience",
              "educationalRole": "student",
              "audienceType": "From first-graders to adults"
            },
            "educationalUse": "Mental arithmetic practice, the four basic operations, order of operations, brackets",
            "teaches": "Mental arithmetic with the four basic operations and brackets",
            "featureList": [
              "Two to four numbers per puzzle",
              "Plus, minus, times and divide, each switched on separately",
              "Brackets you place yourself by dragging",
              "Four target sizes, from small to very large",
              "A hint that plays the next move for you",
              "Puzzles with exactly one solution, on request",
              "Step back into puzzles you have already solved",
              "No sign-up and no ads",
              "Installable as an app and playable offline"
            ],
            "screenshot": "https://funnygerman.github.io/zahlenkoenig/og-image.png",
            "author": {
              "@type": "Person",
              "name": "funnygerman",
              "url": "https://github.com/funnygerman"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <!-- Deliberately empty. A prose fallback lived here (it is what a
         non-JavaScript crawler would read, since `createRoot` clears this
         container on first render) and was removed on the PO's call: it
         was the one part of the SEO round with a cost a player could see —
         a brief flash of text on a slow first paint — against the most
         speculative benefit in it. What a non-JS crawler still gets is the
         title, the meta description and the JSON-LD above, which is the
         part such a crawler actually parses. -->
    <div id="root"></div>
    <!-- A pre-mount watchdog. Deliberately a plain inline script, not part
         of the bundle: the one failure mode ui/ErrorBoundary.tsx *can't*
         catch is the bundle itself never running at all (a 404'd chunk, a
         stuck/broken service worker serving a stale precache — see
         ui/reset.ts's own note) — and a React error boundary is JS that
         lives inside that same bundle, so it's gone in exactly the case it
         would be needed. This has to duplicate a little of ui/reset.ts and
         ui/diagnostics.ts's logic in plain JS for the same reason; it
         can't import them.
         If #root is still empty a few seconds after the page starts, that
         is itself the symptom — nothing needs to have thrown — so this
         shows a copyable report and a "reset" button (unregister every
         service worker, empty every Cache Storage bucket, clear
         localStorage, reload) without waiting on an error event that may
         never come. A MutationObserver cancels the whole thing the moment
         something does render into #root, so a merely slow load never
         shows this. -->
    <script>
      (function () {
        var root = document.getElementById('root')
        if (!root) return

        var earlyErrors = []
        window.addEventListener('error', function (e) {
          earlyErrors.push('error: ' + (e.message || String(e.error)) + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''))
        })
        window.addEventListener('unhandledrejection', function (e) {
          earlyErrors.push('unhandledrejection: ' + ((e.reason && e.reason.message) || String(e.reason)))
        })

        function mounted() {
          return root.childNodes.length > 0
        }

        var observer = new MutationObserver(function () {
          if (mounted()) observer.disconnect()
        })
        observer.observe(root, { childList: true })

        setTimeout(function () {
          if (mounted()) return
          observer.disconnect()
          showFallback()
        }, 5000)

        function showFallback() {
          var swInfo = 'unsupported'
          var cacheInfo = 'unsupported'
          var swReady = 'serviceWorker' in navigator
            ? navigator.serviceWorker.getRegistrations().then(function (regs) {
                swInfo = regs.length
                  ? regs.map(function (r) { return r.scope + ' (active: ' + !!r.active + ', waiting: ' + !!r.waiting + ')' }).join('; ')
                  : 'none registered'
              }).catch(function (e) { swInfo = 'error: ' + e })
            : Promise.resolve()
          var cachesReady = 'caches' in window
            ? caches.keys().then(function (keys) { cacheInfo = keys.length ? keys.join(', ') : 'empty' }).catch(function (e) { cacheInfo = 'error: ' + e })
            : Promise.resolve()

          Promise.all([swReady, cachesReady]).then(function () {
            var storageOk
            try { localStorage.setItem('__zk_diag__', '1'); localStorage.removeItem('__zk_diag__'); storageOk = true } catch (e) { storageOk = false }

            var text = [
              'Zahlenkönig failed to load',
              'Time: ' + new Date().toISOString(),
              'URL: ' + location.href,
              'User agent: ' + navigator.userAgent,
              'Online: ' + navigator.onLine,
              'localStorage writable: ' + storageOk,
              'Service worker controller: ' + (navigator.serviceWorker && navigator.serviceWorker.controller ? navigator.serviceWorker.controller.scriptURL : 'none'),
              'Service worker registrations: ' + swInfo,
              'Cache Storage keys: ' + cacheInfo,
              'Captured errors: ' + (earlyErrors.length ? earlyErrors.join(' | ') : 'none'),
            ].join('\n')

            var wrap = document.createElement('div')
            wrap.style.cssText = 'font-family:system-ui,sans-serif;max-width:28rem;margin:10dvh auto;padding:1.5rem;text-align:center;color:#222;position:relative;z-index:1'
            wrap.setAttribute('role', 'alert')

            var title = document.createElement('p')
            title.style.cssText = 'margin:0 0 .5rem;font-size:1.1rem;font-weight:600'
            title.textContent = 'This page did not load.'

            var hint = document.createElement('p')
            hint.style.cssText = 'margin:0 0 1rem;font-size:.9rem;color:#666'
            hint.textContent = 'Try "Reset & reload" below. If that doesn’t help, copy the report and send it to us.'

            var ta = document.createElement('textarea')
            ta.readOnly = true
            ta.value = text
            ta.setAttribute('aria-label', 'Crash report')
            ta.style.cssText = 'box-sizing:border-box;width:100%;height:10rem;margin-bottom:.75rem;padding:.5rem;font:.75rem/1.4 ui-monospace,monospace;border:1px solid #ccc;border-radius:.5rem'
            ta.addEventListener('focus', function () { ta.select() })

            var actions = document.createElement('div')
            actions.style.cssText = 'display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem'

            var copyBtn = document.createElement('button')
            copyBtn.type = 'button'
            copyBtn.textContent = 'Copy report'
            copyBtn.style.cssText = 'padding:.6rem 1rem;font-size:.9rem;border:none;border-radius:.5rem;background:#2962ae;color:#fff'
            copyBtn.addEventListener('click', function () {
              ta.focus()
              ta.select()
              function done() { copyBtn.textContent = 'Copied!' }
              function failed() { copyBtn.textContent = 'Select the text above' }
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(done, function () {
                  try { document.execCommand('copy'); done() } catch (e) { failed() }
                })
              } else {
                try { document.execCommand('copy'); done() } catch (e) { failed() }
              }
            })

            var resetBtn = document.createElement('button')
            resetBtn.type = 'button'
            resetBtn.textContent = 'Reset & reload'
            resetBtn.style.cssText = 'padding:.6rem 1rem;font-size:.9rem;border:none;border-radius:.5rem;background:#2962ae;color:#fff'
            resetBtn.addEventListener('click', function () {
              var jobs = []
              if ('serviceWorker' in navigator) {
                jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister() }))
                }).catch(function () {}))
              }
              if ('caches' in window) {
                jobs.push(caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k) }))
                }).catch(function () {}))
              }
              try { localStorage.clear() } catch (e) {}
              Promise.all(jobs).then(function () { location.href = location.pathname })
            })

            actions.appendChild(copyBtn)
            actions.appendChild(resetBtn)
            wrap.appendChild(title)
            wrap.appendChild(hint)
            wrap.appendChild(ta)
            wrap.appendChild(actions)
            document.body.appendChild(wrap)
          })
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
